schema = 2
id = "linux/x86_64-gnu"
os = "linux"
arch = "x86_64"
abi = "gnu"
module_root = "platform/linux"
registry = "platform/linux/registry.dlt"
resource_root = "platform/linux/targets/x86_64-gnu/resources"

[capabilities]
required = "memory,file,dir,path,args,process,time,thread,mutex,park,tls,network"
optional = "x11,vulkan-surface,desktop-vulkan,dynamic-runtime"

[toolchain]
toolchain_id = "llvm"
toolchain_version = "1"
translate_role = "translate"
compile_role = "compile"
link_role = "link_driver"
obj_ext = ".o"
exe_ext = ""
target_triple = "x86_64-unknown-linux-gnu"

[link]
# The GNU desktop pack is a cross-link SDK. It carries startup objects and
# link-time DSOs, but the executable deliberately loads the Linux host's
# libc, pthread, X11, Vulkan loader, and GPU ICDs at run time.
default_libs = "gcc,c,m,pthread,gcc"
runtime_helpers = "runtime_helpers.o"
pre_objects = "Scrt1.o, crti.o, crtbeginS.o"
post_objects = "crtendS.o, crtn.o"
link_options = "-fuse-ld=lld -nostdlib -pie -Wl,-dynamic-linker,/lib64/ld-linux-x86-64.so.2 -Wl,--eh-frame-hdr"
stack_size = ""
entry = ""

[link.flags]
output = "-o {path}"
libpath = "-L{path}"
defaultlib = "-l{name}"
subsystem_console = ""
subsystem_gui = ""
flag_entry = ""
stack = ""
deterministic = "-Wl,--build-id=none"
link_target = "--target={triple}"
