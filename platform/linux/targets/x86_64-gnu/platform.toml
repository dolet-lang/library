schema = 2
id = "linux/x86_64-gnu"
os = "linux"
arch = "x86_64"
abi = "gnu"
module_root = "platform/linux"
registry = "platform/linux/registry.dlt"
resource_root = "platform/linux/targets/x86_64-gnu/resources"

[capabilities]
required = "memory,file,dir,path,args,process,time,thread,mutex,park,tls,network"
optional = ""

[toolchain]
toolchain_id = "llvm"
toolchain_version = "1"
translate_role = "translate"
compile_role = "compile"
link_role = "link_driver"
obj_ext = ".o"
exe_ext = ""
target_triple = "x86_64-unknown-linux-gnu"

[link]
# Runtime extern groups are the source of truth for native dependencies.
# Keeping this empty avoids duplicate flags while clang still supplies the
# normal GNU startup objects and libc contract.
default_libs = ""
runtime_helpers = "runtime_helpers.o"
stack_size = ""
entry = ""

[link.flags]
output = "-o {path}"
libpath = "-L{path}"
defaultlib = "-l{name}"
subsystem_console = ""
subsystem_gui = ""
flag_entry = ""
stack = ""
deterministic = "-Wl,--build-id=none"
link_target = "--target={triple}"
