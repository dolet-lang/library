schema = 3
id = "linux/x86_64"
os = "linux"
arch = "x86_64"
abi = "sysv"
runtime = "dolet"
object_format = "elf"
executable_format = "elf"
module_root = "platform/linux"
registry = "platform/linux/registry.dlt"
resource_root = "platform/linux/targets/x86_64/resources"

[capabilities]
required = "memory,file,dir,path,args,process,time,thread,mutex,park,tls,network"
optional = "linux-syscall,x11,vulkan-surface,desktop-vulkan"

[toolchain]
toolchain_id = "llvm"
toolchain_version = "1"
translate_role = "translate"
compile_role = "compile"
link_role = "link_elf"
obj_ext = ".o"
exe_ext = ""

[link]
# No CRT and no C runtime. `dolet-runtime` is a logical boundary satisfied by
# the target-owned helper object below; it is never translated to `-l...`.
provided_libs = "dolet-runtime"
default_libs = ""
runtime_helpers = "runtime_helpers.o"
pre_objects = ""
post_objects = ""
link_options = "-static -m elf_x86_64"
stack_size = ""
entry = "_start"

# Graphical Linux applications use the system ELF loader because X11 and
# Vulkan are system APIs with loader-owned ABIs. The compiler selects this
# profile automatically when the resolved source declares either external
# library; the public target remains `linux/x86_64`.
[link.dynamic]
dynamic_for_libs = "X11,vulkan"
dynamic_resource_root = "platform/linux/targets/x86_64/resources/desktop"
dynamic_default_libs = "pthread,c"
dynamic_runtime_helpers = "runtime_helpers.o"
dynamic_pre_objects = "entry_helpers.o"
dynamic_post_objects = ""
dynamic_link_options = "-m elf_x86_64 --allow-shlib-undefined -dynamic-linker /lib64/ld-linux-x86-64.so.2"
dynamic_entry = "_start"

[link.flags]
output = "-o {path}"
libpath = "-L{path}"
defaultlib = "-l{name}"
subsystem_console = ""
subsystem_gui = ""
flag_entry = "-e {name}"
stack = ""
deterministic = "--build-id=none"
link_target = ""
