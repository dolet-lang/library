schema = 3
id = "windows/x86_64"
os = "windows"
arch = "x86_64"
abi = "win64"
runtime = "dolet"
object_format = "coff"
executable_format = "pe"
module_root = "platform/windows"
registry = "platform/windows/registry.dlt"
resource_root = "platform/windows/resources"

[capabilities]
required = "memory,file,dir,path,args,process,time,thread,mutex,park,tls,network"
optional = "win32,vulkan-surface,desktop-vulkan"

[toolchain]
toolchain_id = "llvm"
toolchain_version = "1"
translate_role = "translate"
compile_role = "compile"
link_role = "link_coff"
obj_ext = ".obj"
exe_ext = ".exe"

[link]
# Dolet owns its runtime. These are Windows system import libraries, not a C
# runtime; pure Dolet math and memory code require no msvcrt/UCRT dependency.
default_libs = "kernel32, ws2_32"
runtime_helpers = "runtime_helpers.obj"
stack_size = 8388608
entry = "_start"

[link.flags]
output = "-out:{path}"
libpath = "-libpath:{path}"
defaultlib = "-defaultlib:{name}"
subsystem_console = "-subsystem:console"
subsystem_gui = "-subsystem:windows"
flag_entry = "-entry:{name}"
stack = "-stack:{size}"
deterministic = "-timestamp:0"
